     <text x="47" y="334" text-anchor="middle" font-size="27">🔧</text>
     <text x="720" y="334" text-anchor="middle" font-size="27">🛠</text>
     <text x="98" y="315" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#0d2b55">Mi nevera no enfría;</text><text x="98" y="337" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#0d2b55">necesito repararla.</text>
     <text x="98" y="353" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#4a6580">Bogotá · Cundinamarca</text>
     <text x="771" y="322" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#0d3151">Técnico u operario</text>
     <text x="771" y="346" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#38566b">Repara equipos</text><text x="771" y="365" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#38566b">e instalaciones.</text>
     <path d="M577,325h71 l-12,-12 m12,12 l-12,12" fill="none" stroke="#18b35d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="0" y="370" width="567" height="76" rx="16" fill="#fff5e7" stroke="#dae7db"/>
     <rect x="673" y="370" width="567" height="76" rx="16" fill="#f4edff" stroke="#d9e9ec"/>
     <circle cx="47" cy="408" r="28" fill="#fff" opacity=".96"/>
