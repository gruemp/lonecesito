     <text x="720" y="583" text-anchor="middle" font-size="27">💼</text>
     <text x="98" y="564" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#0d2b55">Necesito ayuda con</text><text x="98" y="586" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#0d2b55">el diseño de mi logo.</text>
     <text x="98" y="602" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#4a6580">Cartagena · Bolívar</text>
