     <text x="771" y="488" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#0d3151">Cuidador o familiar</text>
     <text x="771" y="512" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#38566b">Acompañamiento</text><text x="771" y="531" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#38566b">y cuidado.</text>
     <path d="M577,491h71 l-12,-12 m12,12 l-12,12" fill="none" stroke="#18b35d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="0" y="536" width="567" height="76" rx="16" fill="#f5efff" stroke="#dae7db"/>
     <rect x="673" y="536" width="567" height="76" rx="16" fill="#eeeeff" stroke="#d9e9ec"/>
