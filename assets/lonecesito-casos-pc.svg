     <text x="47" y="500" text-anchor="middle" font-size="27">💚</text>
     <text x="720" y="500" text-anchor="middle" font-size="27">👪</text>
     <text x="98" y="481" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#0d2b55">Alguien que cuide</text><text x="98" y="503" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#0d2b55">a mi hijo unas horas.</text>
