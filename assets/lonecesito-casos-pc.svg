     <text x="771" y="595" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#38566b">Diseño, redacción</text><text x="771" y="614" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#38566b">y otros servicios.</text>
