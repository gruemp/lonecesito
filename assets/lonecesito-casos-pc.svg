     <text x="47" y="417" text-anchor="middle" font-size="27">📚</text>
     <text x="720" y="417" text-anchor="middle" font-size="27">🎓</text>
     <text x="98" y="398" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#0d2b55">Busco ayuda con</text><text x="98" y="420" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#0d2b55">un trabajo de inglés.</text>
     <text x="98" y="436" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#4a6580">Cali · Valle del Cauca</text>
     <text x="771" y="405" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#0d3151">Estudiante o profesor</text>
     <text x="771" y="429" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#38566b">Apoyo en tareas</text><text x="771" y="448" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#38566b">e idiomas.</text>
     <path d="M577,408h71 l-12,-12 m12,12 l-12,12" fill="none" stroke="#18b35d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="0" y="453" width="567" height="76" rx="16" fill="#ebfbef" stroke="#dae7db"/>
     <rect x="673" y="453" width="567" height="76" rx="16" fill="#ecfcf4" stroke="#d9e9ec"/>
     <circle cx="47" cy="491" r="28" fill="#fff" opacity=".96"/>
